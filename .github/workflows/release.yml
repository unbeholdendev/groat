name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bunx tsc --noEmit
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && format('ghcr.io/{0}:latest', github.repository) || '' }}
      - name: Record published image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "Published $IMAGE:$VERSION ($IMAGE@$DIGEST) for linux/amd64." >> "$GITHUB_STEP_SUMMARY"
      # (#n) is a PR number on Forgejo; on GitHub it would link to the wrong issue.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --format="- %s ([%h]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/%H))" "${prev:+$prev..}$GITHUB_REF_NAME" \
            | sed -E 's/ \(#[0-9]+\)( \(\[)/\1/' \
            > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
